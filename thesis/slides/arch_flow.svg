<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" font-family="Georgia, 'Times New Roman', serif">
  <defs>
    <linearGradient id="band2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#173E63"/><stop offset="0.5" stop-color="#2E6DB4"/><stop offset="1" stop-color="#5FC3E6"/></linearGradient>
    <marker id="a2" markerWidth="11" markerHeight="11" refX="8" refY="5.5" orient="auto"><path d="M0,1 L9,5.5 L0,10 Z" fill="#2E6DB4"/></marker>
    <filter id="sh2" x="-15%" y="-15%" width="130%" height="140%"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#1a2a3a" flood-opacity="0.15"/></filter>
  </defs>
  <rect width="1280" height="720" fill="#ffffff"/>
  <rect width="1280" height="58" fill="url(#band2)"/>
  <rect x="1130" width="150" height="58" fill="#5FC3E6" opacity="0.5"/>
  <path d="M62,0 H142 V78 L102,108 L62,78 Z" fill="#29ABE2"/>
  <circle cx="102" cy="32" r="15" fill="none" stroke="#fff" stroke-width="2.5"/><circle cx="102" cy="32" r="4" fill="#fff"/>

  <text x="56" y="104" font-size="14" font-weight="bold" fill="#2E6DB4" letter-spacing="0.5">CANOPY · REQUEST FLOW</text>
  <text x="56" y="140" font-size="30" font-weight="bold" fill="#1A1A1A">What happens when you scan an area</text>

  <!-- vertical numbered flow: 7 steps -->
  <!-- step template: circle + box -->
  <!-- y positions -->
  <!-- 1 -->
  <g filter="url(#sh2)"><rect x="120" y="180" width="1040" height="62" rx="8" fill="#fff" stroke="#CFE0F1"/></g>
  <circle cx="160" cy="211" r="20" fill="#2E6DB4"/><text x="160" y="217" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">1</text>
  <text x="200" y="206" font-size="17" font-weight="bold" fill="#1A1A1A">User draws a rectangle / polygon on the Leaflet map</text>
  <text x="200" y="230" font-size="13.5" fill="#33414D">Frontend (React) sends the bounding box + chosen model &amp; confidence to the backend.</text>
  <text x="1130" y="217" font-size="12" fill="#2E6DB4" font-weight="bold" text-anchor="end">POST /scan_region</text>

  <g filter="url(#sh2)"><rect x="120" y="258" width="1040" height="62" rx="8" fill="#fff" stroke="#CFE0F1"/></g>
  <circle cx="160" cy="289" r="20" fill="#2E7D32"/><text x="160" y="295" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">2</text>
  <text x="200" y="284" font-size="17" font-weight="bold" fill="#1A1A1A">Backend fetches satellite tiles (ESRI / Google) &amp; stitches them</text>
  <text x="200" y="308" font-size="13.5" fill="#33414D">Big areas are split into a grid of sub-regions at zoom 19 (~0.3 m / pixel).</text>
  <text x="1130" y="295" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="end">capture_bbox()</text>

  <g filter="url(#sh2)"><rect x="120" y="336" width="1040" height="62" rx="8" fill="#fff" stroke="#CFE0F1"/></g>
  <circle cx="160" cy="367" r="20" fill="#2E7D32"/><text x="160" y="373" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">3</text>
  <text x="200" y="362" font-size="17" font-weight="bold" fill="#1A1A1A">Sliding-window tiling — 640 + 128 px overlap</text>
  <text x="200" y="386" font-size="13.5" fill="#33414D">Every tile keeps small crowns at native resolution; the model never sees a shrunk image.</text>
  <text x="1130" y="373" font-size="12" fill="#2E7D32" font-weight="bold" text-anchor="end">tile_image()</text>

  <g filter="url(#sh2)"><rect x="120" y="414" width="1040" height="62" rx="8" fill="#fff" stroke="#1697A6" stroke-width="1.6"/></g>
  <circle cx="160" cy="445" r="20" fill="#1697A6"/><text x="160" y="451" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">4</text>
  <text x="200" y="440" font-size="17" font-weight="bold" fill="#1A1A1A">Chosen engine runs on each tile  →  box · mask · confidence</text>
  <text x="200" y="464" font-size="13.5" fill="#33414D">The model is a swappable adapter: YOLOv8-seg · Mask R-CNN · DeepForest + SAM 2 · Ensemble.</text>
  <text x="1130" y="451" font-size="12" fill="#1697A6" font-weight="bold" text-anchor="end">adapter.predict()</text>

  <g filter="url(#sh2)"><rect x="120" y="492" width="1040" height="62" rx="8" fill="#fff" stroke="#CFE0F1"/></g>
  <circle cx="160" cy="523" r="20" fill="#3F6FB5"/><text x="160" y="529" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">5</text>
  <text x="200" y="518" font-size="17" font-weight="bold" fill="#1A1A1A">Merge tiles · Global NMS · pixel → WGS-84 conversion</text>
  <text x="200" y="542" font-size="13.5" fill="#33414D">Duplicate crowns on tile seams are removed (IoU 0.5); every detection gets real lat / lng.</text>
  <text x="1130" y="529" font-size="12" fill="#3F6FB5" font-weight="bold" text-anchor="end">global_nms() · geo</text>

  <g filter="url(#sh2)"><rect x="120" y="570" width="1040" height="62" rx="8" fill="#fff" stroke="#CFE0F1"/></g>
  <circle cx="160" cy="601" r="20" fill="#173E63"/><text x="160" y="607" font-size="17" font-weight="bold" fill="#fff" text-anchor="middle">6</text>
  <text x="200" y="596" font-size="17" font-weight="bold" fill="#1A1A1A">Persist to SQLite · stream live progress · draw on map</text>
  <text x="200" y="620" font-size="13.5" fill="#33414D">Results saved (sessions→snapshots→runs→detections) and exportable as GeoJSON / CSV / HTML.</text>
  <text x="1130" y="607" font-size="12" fill="#173E63" font-weight="bold" text-anchor="end">NDJSON stream</text>

  <!-- connecting arrows down the left -->
  <g stroke="#2E6DB4" stroke-width="2.5" fill="none">
    <line x1="160" y1="242" x2="160" y2="256" marker-end="url(#a2)"/>
    <line x1="160" y1="320" x2="160" y2="334" marker-end="url(#a2)"/>
    <line x1="160" y1="398" x2="160" y2="412" marker-end="url(#a2)"/>
    <line x1="160" y1="476" x2="160" y2="490" marker-end="url(#a2)"/>
    <line x1="160" y1="554" x2="160" y2="568" marker-end="url(#a2)"/>
  </g>

  <text x="640" y="676" font-size="13.5" fill="#33414D" text-anchor="middle"><tspan font-weight="bold" fill="#1A1A1A">No manual step</tspan> between the user drawing an area and the finished, downloadable inventory — the whole chain is automated.</text>
</svg>
